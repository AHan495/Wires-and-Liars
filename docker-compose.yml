services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    networks:
      - wires-and-liars-net

  nginx-proxy-acme:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=austinone.han@mail.utoronto.ca
      - NGINX_PROXY_CONTAINER=nginx-proxy
    networks:
      - wires-and-liars-net

  frontend:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/wires-and-liars-frontend
    container_name: wires-and-liars-frontend
    restart: always
    expose:
      - 80
    environment:
      - VIRTUAL_HOST=${FRONTEND_DOMAIN}
      - LETSENCRYPT_HOST=${FRONTEND_DOMAIN}
    networks:
      - wires-and-liars-net

  backend:
    image: ghcr.io/utsc-cscc09-programming-on-the-web/wires-and-liars-backend
    container_name: wires-and-liars-backend
    restart: always
    expose:
      - 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      - VIRTUAL_HOST=${BACKEND_DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${BACKEND_DOMAIN}
    networks:
      - wires-and-liars-net

  postgres:
    image: postgres:16-alpine
    container_name: wires-and-liars-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wires_and_liars}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wires_and_liars}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wires-and-liars-net

  redis:
    image: redis:7-alpine
    container_name: wires-and-liars-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wires-and-liars-net

volumes:
  postgres_data:
  redis_data:

networks:
  wires-and-liars-net:
    driver: bridge
